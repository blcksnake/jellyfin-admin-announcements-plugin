name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Announcements.csproj

      - name: Build
        run: dotnet build Jellyfin.Plugin.Announcements.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.Announcements.csproj -c Release -o publish --no-build
